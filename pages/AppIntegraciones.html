
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/DiseñoGeneral.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="../images/Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <title>Integraciones</title>
  </head>

<body>
    <!-- Navbar -->
    <nav class="navbar position-relative">
        <div
            class="container-fluid d-flex justify-content-between align-items-center navbar-container"
        >
        <a class="navbar-brand nvbar d-flex align-items-center" href="../pages/Front_APPs.html">
            <img src="../images/teco.png" alt="Logo" width="70" height="22" class="d-inline-block">
                <span class="ms-2">PORTAL ITAS</span>
        </a>
    
            <span class="navbar-text nvbar navbar-center">
                Servicios ITAS
            </span>
    
            <div class="d-flex align-items-center gap-2">
                <button
                    class="nvbar"
                    onclick="history.back()"
                    style="
                        background:none;
                        border:1px solid white;
                        color:white;
                        padding:4px 10px;
                        border-radius:4px;
                    "
                >
                    Volver
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Servicios ITAS</h2>
    
            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#nuevoPedidoModal"
            >
                Ejecutar Pedido
            </button>
        </div>
    
        <div class="form-check mb-3">
            <input
                class="form-check-input"
                type="checkbox"
                id="chkMisPedidos"
            />
    
            <label class="form-check-label" for="chkMisPedidos">
                Ver solamente mis pedidos
            </label>
        </div>
    
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Servicios</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
    
                <tbody id="tablaPedidos">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
    
    </div>

  

     <!-- Modal Nuevo Pedido -->
<div
class="modal fade"
id="nuevoPedidoModal"
tabindex="-1"
aria-hidden="true"
>
<div class="modal-dialog modal-lg">
  <div class="modal-content">

    <div class="modal-header">
      <h5 class="modal-title">
        Nuevo Pedido de Servicio
      </h5>

      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
      ></button>
    </div>

    <div class="modal-body">

      <div class="row g-3">

        <div class="col-md-3">
          <label class="form-label">Servicios ITAS</label>
          <select class="form-select" id="integracion">
            <option value="S020">S020</option>
            <option value="S039">S039</option>
            <option value="S623">S623</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Tipo de búsqueda</label>
        
          <select class="form-select" id="tipoBusqueda">
            <option value="">Seleccione...</option>
            <option value="Linea">Línea</option>
            <option value="Subscriber">Subscriber</option>
            <option value="Cuenta">Cuenta</option>
            <option value="Customer">Customer</option>
          </select>
        </div>
        
        <div class="col-md-4">
          <label class="form-label" id="lblValorBusqueda">
            Valor
          </label>
        
          <input
            type="text"
            class="form-control"
            id="valorBusqueda"
            disabled
          >
        </div>

        <div class="col-md-12">
          <label class="form-label">
            Justificación
          </label>

          <textarea
            class="form-control"
            id="justificacion"
            rows="4"
            placeholder="Motivo de la ejecución"
          ></textarea>
        </div>

      </div>

    </div>

    <div class="modal-footer">
      <button
        class="btn btn-secondary"
        data-bs-dismiss="modal"
      >
        Cancelar
      </button>

      <button
        class="btn btn-primary"
        id="btnCrearPedido"
      >
        Ejecutar
      </button>
    </div>

  </div>
</div>
</div>

<!-- Modal Ver Resultado -->
<div
  class="modal fade"
  id="resultadoModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          Resultado del Pedido
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <div class="modal-body">

        <div class="row g-3">

          <div class="col-md-6">
            <label class="fw-bold">Estado</label>
            <div id="resultadoEstado"></div>
          </div>

          <div class="col-md-6">
            <label class="fw-bold">Fecha Inicio</label>
            <div id="resultadoFechaInicio"></div>
          </div>

          <div class="col-md-6">
            <label class="fw-bold">Fecha Fin</label>
            <div id="resultadoFechaFin"></div>
          </div>

          <div class="col-md-12">
            <label class="fw-bold">Resultado JSON</label>
            <pre id="resultadoJson" class="border p-2 bg-light"></pre>
          </div>

          <div class="col-md-12">
            <label class="fw-bold">Resultado</label>
            <textarea
              id="resultadoTexto"
              class="form-control"
              rows="4"
              readonly
            ></textarea>
          </div>

          <div class="col-md-12">
            <label class="fw-bold">Error Detalle</label>
            <textarea
              id="resultadoError"
              class="form-control"
              rows="4"
              readonly
            ></textarea>
          </div>

        </div>

      </div>

    </div>
  </div>
</div>
   <!-- Scripts -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   <script src="../js/config.js"></script>
   <script src="../js/Front_APPs.js"></script>
   <script src="../js/Integraciones.js"></script>
   </body>
 </html>
